  </text>

  <!-- Highlight Feature Row -->
  <g transform="translate(80, 400)">
    <!-- Box 1 -->
    <rect x="0" y="0" width="310" height="85" rx="14" fill="#1E293B" fill-opacity="0.8" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="34" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-transform="uppercase" letter-spacing="1">Consolidated Pay</text>
    <text x="24" y="66" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800">₹75,400 - ₹1,69,600</text>

    <!-- Box 2 -->
    <rect x="330" y="0" width="340" height="85" rx="14" fill="#1E293B" fill-opacity="0.8" stroke="#334155" stroke-width="1.5"/>
    <text x="354" y="34" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-transform="uppercase" letter-spacing="1">Selection Mode</text>
    <text x="354" y="66" fill="#4ADE80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800">Personal Interview (100%)</text>

    <!-- Box 3 -->
    <rect x="690" y="0" width="350" height="85" rx="14" fill="#1E293B" fill-opacity="0.8" stroke="#334155" stroke-width="1.5"/>
    <text x="714" y="34" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-transform="uppercase" letter-spacing="1">Apply Online Dates</text>
    <text x="714" y="66" fill="#FBBF24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800">21 Sep – 05 Oct 2026</text>
  </g>

  <!-- Bottom Details Bar -->
  <line x1="80" y1="540" x2="1120" y2="540" stroke="#334155" stroke-width="1"/>
  <text x="80" y="580" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500">
    Eligibility: B.E. / B.Tech / PG Degree / CA / ICWA / MBBS • Miniratna Category-I CPSE • Ministry of Mines
  </text>
  <text x="1120" y="580" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="end">
    Full Guide &amp; Apply Links on TypeHindi.in →
  </text>
</svg>
